<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色外观预览 · 动小学</title>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f4;color:#243d53;font:14px/1.8 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1080px;margin:28px auto;padding:0 22px 40px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}a{color:#306b8d}h1{font-size:25px;font-weight:550;margin:19px 0 4px}.intro{color:#657e8e;margin:0 0 20px}.portraits{display:grid;grid-template-columns:1fr 1fr;gap:22px}.portrait{overflow:hidden;background:#fffefa;border:1px solid #d6e1e6;border-radius:17px}.portrait h2{font-size:16px;margin:15px 20px 2px}.portrait p{font-size:12px;color:#6c8493;margin:0 20px 14px}.portrait canvas{display:block;width:100%;height:410px;background:#e4ebee}.views{display:flex;justify-content:center;gap:9px;padding:16px}.views button{font:inherit;font-size:12px;border:1px solid #cedde4;border-radius:8px;padding:6px 15px;background:white;color:#365e78;cursor:pointer}.views button[aria-pressed=true]{background:#234d73;color:white;border-color:#234d73}.note{font-size:12px;color:#697f8e;margin-top:20px}.status{padding:15px;background:#fffefa;border-radius:10px;margin-bottom:16px}button:focus-visible,a:focus-visible{outline:3px solid #c99040;outline-offset:3px}@media(max-width:600px){.portraits{grid-template-columns:1fr}.portrait canvas{height:370px}main{margin-top:15px;padding:0 14px 30px}h1{font-size:22px}}
</style></head><body><main><header><b>动小学 · 足踝评估诊室</b><a href="index.html?demo=1">返回接诊 →</a></header><h1>角色外观预览</h1><details class="intro"><summary style="cursor:pointer">查看两人的正面全身设定图</summary><img src="./assets/reference-characters/full-body-v39.webp" width="1086" height="1448" alt="林治疗师穿深蓝短袖制服，陈女士穿灰色卫衣，两人正面并排站立。" style="display:block;max-width:100%;width:auto;height:auto;max-height:75vh;margin:12px auto"></details><p><button id="frameToggle" type="button">查看面部与上身</button></p><p id="status" class="status" role="status">正在准备角色…</p><div class="portraits"><section class="portrait"><h2>林治疗师 · 男</h2><p>深蓝短袖制服 · 白色内搭 · 黑色短发</p><canvas id="therapist" aria-label="林治疗师三维预览"></canvas><div class="views" data-person="therapist"><button data-angle="0" aria-pressed="true">正面</button><button data-angle="1.57" aria-pressed="false">侧面</button><button data-angle="0.70" aria-pressed="false">斜侧</button><button data-angle="3.14" aria-pressed="false">背面</button></div></section><section class="portrait"><h2>陈女士 · 女</h2><p>宽松灰色卫衣 · 深色长裤 · 白鞋 · 棕色低马尾</p><canvas id="patient" aria-label="陈女士三维预览"></canvas><div class="views" data-person="patient"><button data-angle="0" aria-pressed="true">正面</button><button data-angle="1.57" aria-pressed="false">侧面</button><button data-angle="0.70" aria-pressed="false">斜侧</button><button data-angle="3.14" aria-pressed="false">背面</button></div></section></div><div class="views" aria-label="两位人物的姿态"><button data-pose="standing" aria-pressed="true">站立</button><button data-pose="seated" aria-pressed="false">坐姿</button><button data-pose="walking" aria-pressed="false">步行</button></div><p class="note">转动人物，查看正面、斜侧和侧面。</p></main>
<script type="module">
import * as THREE from 'three';
import {createActors} from './actors.js';

const scene=new THREE.Scene();scene.background=new THREE.Color('#e4ebee');
scene.add(new THREE.HemisphereLight('#fff8ef','#a7b7c2',1.65));
const key=new THREE.DirectionalLight('#fff8eb',2.0);key.position.set(-2,3,4);scene.add(key);
const fill=new THREE.DirectionalLight('#e8f5ff',.65);fill.position.set(2,1,3);scene.add(fill);
let actors;const portraits=[];let fullBody=true,previewPose='standing';
for(const role of ['therapist','patient']){
 const canvas=document.getElementById(role),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
 const camera=new THREE.OrthographicCamera(-.4,.4,.32,-.32,.01,10);camera.position.set(0,1.51,2.5);camera.lookAt(0,1.51,0);
 portraits.push({role,canvas,renderer,camera,angle:0});
}
function draw(){
 if(!actors)return;
 for(const p of portraits){
  const w=p.canvas.clientWidth,h=p.canvas.clientHeight,aspect=w/h;
  if(p.width!==w||p.height!==h){p.renderer.setSize(w,h,false);p.width=w;p.height=h;}
  const half=fullBody?.95:.225;p.camera.left=-half*aspect;p.camera.right=half*aspect;p.camera.top=half;p.camera.bottom=-half;p.camera.position.y=fullBody?.9:1.607;p.camera.lookAt(0,fullBody?.9:1.607,0);p.camera.updateProjectionMatrix();
  actors.patient.root.visible=p.role==='patient';actors.therapist.root.visible=p.role==='therapist';
  actors[p.role].face(p.angle);p.renderer.render(scene,p.camera);
 }
}
document.querySelectorAll('[data-angle]').forEach(button=>button.addEventListener('click',()=>{
 const group=button.closest('[data-person]'),portrait=portraits.find(p=>p.role===group.dataset.person);portrait.angle=Number(button.dataset.angle);
 group.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));draw();
}));
document.getElementById('frameToggle').addEventListener('click',e=>{fullBody=!fullBody;e.target.textContent=fullBody?'查看面部与上身':'查看全身';draw();});
window.addEventListener('resize',draw);
document.querySelectorAll('[data-pose]').forEach(button=>button.onclick=()=>{if(!actors)return;previewPose=button.dataset.pose;for(const role of ['therapist','patient']){actors[role].setLocomotion(previewPose==='walking');actors[role].setPose(previewPose==='seated'?'seated':'standing',true);}fullBody=true;document.getElementById('frameToggle').textContent=fullBody?'查看面部与上身':'查看全身';document.querySelectorAll('[data-pose]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));actors.update(0);draw();});
let prev=performance.now();function animate(now){const dt=Math.min(.1,(now-prev)/1000);prev=now;if(actors&&previewPose==='walking'){actors.update(dt);draw();}requestAnimationFrame(animate);}requestAnimationFrame(animate);

createActors(scene,{modelUrl:'assets/patient-motion.glb'}).then(value=>{
 actors=value;for(const role of ['patient','therapist']){actors[role].setPosition([0,0,0]);actors[role].setPose('standing',true);actors[role].setTalking(false);}
 actors.update(0);document.getElementById('status').hidden=true;draw();document.body.dataset.ready='true';
 if(new URLSearchParams(location.search).get('pose')==='walking'){
  document.querySelectorAll('[data-angle="1.57"]').forEach(button=>button.click());
  document.querySelector('[data-pose="walking"]').click();
 }
 if(new URLSearchParams(location.search).get('view')==='patient-oblique'){
  document.querySelector('[data-person="patient"] [data-angle="0.70"]').click();
  if(fullBody)document.getElementById('frameToggle').click();
  if(matchMedia('(max-width:600px)').matches)document.getElementById('patient').scrollIntoView({block:'center'});
 }
}).catch(error=>{document.getElementById('status').textContent='角色暂未载入，请刷新后重试。';console.error(error);});
</script></body></html>
