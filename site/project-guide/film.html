<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五段情境视频与实训</title><style>body{margin:0;background:#f5f6f1;color:#203b30;font:15px/1.8 Microsoft YaHei,sans-serif}main{max-width:1050px;margin:40px auto;padding:24px}a{color:#245b46}section{padding:24px;background:white;margin:20px 0;border-radius:15px}video{width:100%;max-height:460px;background:#18372c}h1{font-size:30px}</style></head><body><main><a href="../clinic3d/index.html">← 返回足踝虚拟诊室</a><h1>五段病例视频</h1><p>五段用户提供的视频已剪辑并接到合适环节。看片不代替测量、判断或后测；跳步不会自动写入检查结果。</p><section><h2>先了解她的困扰，再商量检查。</h2><video controls preload="none" poster="../soap/media/intro.jpg" src="../soap/media/intro-playback.mp4"></video><p>情境导入 · 保留共情与检查目的；病史以交互病例为准。</p></section><section><h2>坐位与站位，为什么都要看？</h2><video controls preload="none" poster="../soap/media/arch.jpg" src="../soap/media/arch.mp4"></video><p>观察足弓负重变化 · 结论需要进一步验证。</p></section><section><h2>自然走过步道，不刻意找落脚点。</h2><video controls preload="none" poster="../soap/media/gait.jpg" src="../soap/media/gait.mp4"></video><p>观察步行过程 · 后续数值为独立合成练习，未从视频提取。</p></section><section><h2>从屏幕与足底，认识扫描情境。</h2><video controls preload="none" poster="../soap/media/scan.jpg" src="../soap/media/scan-voiced.mp4"></video><p>设备情境短镜头 · 屏幕字符与彩图不作为有效测量数据。</p></section><section><h2>训练重点回到控制、平衡与步行。</h2><video controls preload="none" poster="../soap/media/plan.jpg" src="../soap/media/plan.mp4"></video><p>共同计划 · 按实际发现和患者目标讨论。</p></section></main></body></html>
